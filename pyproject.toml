[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ourbench-cli"
version = "0.1.0"
description = "Lightweight cPilot-GUI benchmark wrapper for llama.cpp"
requires-python = ">=3.9"
readme = "README.md"
authors = [{ name = "cPilot-GUI" }]

[project.scripts]
ourbench = "ourbench_cli.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
